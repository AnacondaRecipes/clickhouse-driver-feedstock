{% set name = "clickhouse-driver" %}
{% set version = "0.2.10" %}
{% set sha256 = "925fc6ecda1e5314e3f03bcb493955c068b070cdba221fb8ce27329ee8a7f71b" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/c/clickhouse-driver/clickhouse_driver-0.2.10.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<37]

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - cython
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - pytz
    - tzlocal
  run_constrained:
    - clickhouse-cityhash >=1.0.2.1
    - numpy >=1.12.0
    - pandas >=0.24.0

test:
  imports:
    - clickhouse_driver
    - clickhouse_driver.columns
    - clickhouse_driver.compression
    - clickhouse_driver.settings
    - clickhouse_driver.streams
    - clickhouse_driver.util
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/mymarilyn/clickhouse-driver
  doc_url: https://clickhouse-driver.readthedocs.io/
  dev_url: https://github.com/mymarilyn/clickhouse-driver
  license: MIT
  summary: Python driver with native interface for ClickHouse
  description: ClickHouse Python Driver with native interface support
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kszucs
    - xzkostyan
    - cpcloud
    - xmnlab
    - xhochy
